<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d68a"/>
      <stop offset="1" stop-color="#e0ba5f"/>
    </linearGradient>
  </defs>

  <!-- Cerchio di sfondo -->
  <circle cx="32" cy="32" r="28" fill="url(#bg)" />

  <!-- Ingranaggio semplificato -->
  <g transform="translate(32 32)">
    <circle r="10" fill="#111827" />
    <circle r="5" fill="#4b5563" />
  </g>

  <!-- Chiave inglese -->
  <g transform="translate(32 32) rotate(-20)">
    <rect x="-2" y="6" width="4" height="16" rx="2" fill="#e5e7eb" />
    <path
      d="M -4 4 L 0 0 L 4 4 L 1 7 L -1 7 Z"
      fill="#e5e7eb"
    />
  </g>
</svg>

