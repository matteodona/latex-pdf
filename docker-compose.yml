services:
  backend:
    build: ./backend
    container_name: latex-backend
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
      - ./backend/projects:/app/projects:ro
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:8080

  frontend:
    build: ./frontend
    container_name: latex-frontend
    ports:
      - "8080:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:3001

volumes:
  backend-data: